name: Build miu-iYellowPage

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Publish build failure to GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "## Build failure"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo
            echo 'BUILD LOG (last 250 lines):'
            tail -n 250 build.log
          } > failure.md
          gh issue create --title "CI build failure: ${GITHUB_SHA::7}" --body-file failure.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miu-iYellowPage-build-logs
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: miu-iYellowPage-debug
          path: app/build/outputs/apk/debug/*.apk
